# ==============================================================================
# Cordis Patch Layer: DSH GitHub Webhook Ingress & Dispatcher Configuration
# Spec: DSH Autonomous Stream-Aligned Team Integration
# Profile: headless / web
# Repository: Vietlele2001/backlog-to-harness
# ==============================================================================

- insert:
    - id: dsh-webhook-github
      name: '@deepseek-ai/dsh-webhook-github'
      config:
        # Tên định danh nguồn webhook instance
        source: 'github-backlog'
        # Route tiếp nhận POST payload webhook từ GitHub
        path: '/webhook/github'
        # Tên biến môi trường chứa secret để xác thực HMAC SHA-256
        secretEnv: 'GITHUB_WEBHOOK_SECRET'
        # Trần kích thước tối đa cho body payload (10 MB)
        maxBodyBytes: 10485760

- insert:
    - id: dsh-webhook-rules
      name: '@deepseek-ai/dsh-webhook'
      config:
        rules:
          - id: 'autonomous-backlog-dispatch'
            kind: 'github'
            targetRepo: 'Vietlele2001/backlog-to-harness'
            events:
              - 'issues.labeled'
              - 'issues.opened'
            filter:
              labels:
                - 'status:ready'
                - 'type:ci-repair'
            atomicLock:
              removeLabel: 'status:ready'
              addLabel: 'status:in-progress'
              commentTemplate: |
                🤖 **[Autonomous Stream-Aligned Team]**
                Task #{{issue.number}} đã được **Atomic Locked** và tiếp nhận vào hàng đợi thực thi tự trị.
                - **Thời điểm:** `{{timestamp}}`
                - **Trạng thái:** `status:in-progress`
                - **Runtime Engine:** DeepSeek Harness Headless Session
            escalation:
              removeLabel: 'status:in-progress'
              addLabel: 'need:human-input'
              commentTemplate: |
                🚨 **[Autonomous Stream-Aligned Team - Escalation]**
                Phiên thực thi tự trị gặp sự cố kỹ thuật hoặc bế tắc.
                - **Nguyên nhân:** `{{error}}`
                - **Trạng thái:** `need:human-input`
                - Kính mời Human Developer can thiệp tháo gỡ bế tắc.
            completion:
              removeLabel: 'status:in-progress'
              addLabel: 'status:review-ready'
              commentTemplate: |
                🎉 **[Autonomous Stream-Aligned Team - Session Completed]**
                Phiên thực thi tự trị cho Task #{{issue.number}} đã hoàn tất.
                - **Trạng thái:** `status:review-ready`
                - Sẵn sàng cho Human Code Review & Merge.
            session:
              agentPreset: 'developer'
              permissionPreset: 'workspace-write'
              titleTemplate: '🤖 Autonomous Task #{{issue.number}}: {{issue.title}}'
